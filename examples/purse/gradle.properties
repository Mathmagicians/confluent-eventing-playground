org.gradle.configuration-cache=true
# the one Spring Boot version, named here and in the plugins block of build.gradle
springBootVersion=4.1.1
# the platform's Gradle conventions: this checkout's, or a copy of the file next to a build outside it
platformGradle=../../platform.gradle
# the platform this story plays on, a version the cicd workflow published to GitHub Packages: a release, 0.1.0,
# or the snapshot of the next one; make platform-install puts the checkout's own into the local Maven repository
platformVersion=0.0.4-SNAPSHOT
