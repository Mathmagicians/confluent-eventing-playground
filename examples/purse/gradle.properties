org.gradle.configuration-cache=true
# the one Spring Boot version, named here and in the plugins block of build.gradle
springBootVersion=4.1.1
# the platform's Gradle conventions: this checkout's, or a copy of the file next to a build outside it
platformGradle=../../platform.gradle
# the platform this story plays on: the newest the cicd workflow published to GitHub Packages, looked up on every
# build; a release, 0.1.0, pins it instead. make platform-install puts the checkout's own into the local Maven
# repository, taken first when it is the newest
platformVersion=latest.integration
