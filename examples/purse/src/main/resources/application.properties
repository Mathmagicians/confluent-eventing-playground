spring.application.name=purse
# the profile when none is given; local reads nothing. test and prod are Confluent Cloud, connected by the
# platform's kafka.properties, each naming its topics
spring.profiles.default=local

# the application modules Spring Modulith documents and verifies are the packages marked @ApplicationModule
spring.modulith.detection-strategy=explicitly-annotated

# the story this process plays, the only one in this image; its settings are --purse.owners="Alice:1000,White Rabbit:500"
story=purse

# console line: time, level, thread, class, message
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) [%t] %clr(%logger{0}){cyan} %clr(:){faint} %m%n%wEx
