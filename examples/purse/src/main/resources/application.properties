spring.application.name=purse
# what every distribution of the platform wants: the Modulith strategy, the console line
spring.config.import=classpath:platform.properties
# default profile local doesnt interact with kafka, but reads from console, and publishes to the log.
# test and prod are Confluent Cloud, connected by the platform's kafka.properties, each naming its topics
spring.profiles.default=local
# the story this process plays, the only one in this image; its settings are --purse.owners="Alice:1000,White Rabbit:500"
story=purse
