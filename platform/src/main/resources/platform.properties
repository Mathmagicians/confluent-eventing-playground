# What every distribution of the platform wants, imported by its application.properties:
# spring.config.import=classpath:platform.properties

# the region the platform hands to its clients: a story publishes for it unless its own settings say another,
# --load.region and --tea-party.region, and the console stamps it on what it reads until told `region: <other>`
region=EMEA

# the application modules Spring Modulith documents and verifies are the packages marked @ApplicationModule
spring.modulith.detection-strategy=explicitly-annotated

# console line: time, level, thread, class, message; short, since the flock's and the test's logs are read by humans
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) [%t] %clr(%logger{0}){cyan} %clr(:){faint} %m%n%wEx
