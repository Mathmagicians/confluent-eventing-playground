# The flock: one generator per event type, and the tea party that settles their orders. `make up` starts the
# generators, `make up-<type>` starts one, `make up-tea-party` the tea party, against ENV. Defaults live here;
# override with environment variables, e.g. OFFER_CONCURRENT=50 TTL=300 make up-offer.
name: confluent-eventing-playground

x-generator: &generator
  image: confluent-eventing-playground:${VERSION:?set by make, the version is Gradle's}   # make docker-image
  # the profile is the environment; make sources what the image reads from .env.<ENV>.private
  environment:
    SPRING_PROFILES_ACTIVE: ${ENV:?set by make, test or prod}
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?from .env.<ENV>.private}
    KAFKA_API_KEY: ${KAFKA_API_KEY:?from .env.<ENV>.private}
    KAFKA_API_SECRET: ${KAFKA_API_SECRET:?from .env.<ENV>.private}
    SCHEMA_REGISTRY_REST_ENDPOINT: ${SCHEMA_REGISTRY_REST_ENDPOINT:?from .env.<ENV>.private}
    SCHEMA_REGISTRY_API_KEY: ${SCHEMA_REGISTRY_API_KEY:?from .env.<ENV>.private}
    SCHEMA_REGISTRY_API_SECRET: ${SCHEMA_REGISTRY_API_SECRET:?from .env.<ENV>.private}

services:
  product-generator:
    <<: *generator
    command:
      - --load.type=product
      - --load.concurrent=${PRODUCT_CONCURRENT:-10}
      - --load.interval=${PRODUCT_INTERVAL:-250}
      - --load.region=${REGION:-EMEA}
      - --load.ttl=${TTL:-60}

  offer-generator:
    <<: *generator
    command:
      - --load.type=offer
      - --load.concurrent=${OFFER_CONCURRENT:-10}
      - --load.interval=${OFFER_INTERVAL:-250}
      - --load.region=${REGION:-EMEA}
      - --load.ttl=${TTL:-60}

  order-generator:
    <<: *generator
    command:
      - --load.type=order
      - --load.concurrent=${ORDER_CONCURRENT:-10}
      - --load.interval=${ORDER_INTERVAL:-250}
      - --load.region=${REGION:-EMEA}
      - --load.ttl=${TTL:-60}

  # the same image playing another story: reads the region's offers and orders, publishes its transactions,
  # runs until stopped; not part of `make up`, see the tea-party profile
  tea-party:
    <<: *generator
    profiles: [tea-party]
    command:
      - --story=tea-party
      - --tea-party.region=${REGION:-EMEA}
