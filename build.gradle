plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.10.0' // not in the Boot BOM, 2026-09-03
}

group = 'dk.mathmagicians.playground'
description = 'confluent-eventing-playground'

// version from git tags: at v1.2.3 it is 1.2.3, after it 1.2.4-SNAPSHOT, with no tag 0.0.1-SNAPSHOT
def describe = providers.exec {
    commandLine 'git', 'describe', '--tags', '--match', 'v*', '--long', '--always'
}.standardOutput.asText.get().trim()
def tagged = describe =~ /^v(\d+)\.(\d+)\.(\d+)-(\d+)-g[0-9a-f]+$/
def (major, minor, patch, commits) = tagged.matches() ? (1..4).collect { tagged[0][it] as int } : [0, 0, 0, 1]
def nextVersion = "${major}.${minor}.${patch + 1}"
version = commits == 0 ? "${major}.${minor}.${patch}" : "${nextVersion}-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://packages.confluent.io/maven/' } // the Schema Registry client and the Protobuf serializer
    // architecture-discovery: the developer loop installs it locally, make discovery-install; CI publishes it to
    // GitHub Packages, which needs a token even to read, GITHUB_ACTOR and GITHUB_TOKEN from the environment
    mavenLocal {
        content { includeGroup 'dk.mathmagicians.playground' }
    }
    maven {
        name = 'GitHubPackages'
        url = 'https://maven.pkg.github.com/mathmagicians/confluent-eventing-playground'
        credentials {
            username = System.getenv('GITHUB_ACTOR')
            password = System.getenv('GITHUB_TOKEN')
        }
        content { includeGroup 'dk.mathmagicians.playground' }
    }
}

// the library is a snapshot while it lives here: always take the newest
configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'com.google.protobuf:protobuf-java'
    implementation 'io.confluent:kafka-protobuf-serializer:8.3.1' // Confluent's own, not in the Boot BOM, 2026-09-07
    implementation platform('org.jmolecules:jmolecules-bom:2025.0.2') // not in the Boot BOM, 2026-09-07
    implementation 'org.jmolecules:jmolecules-hexagonal-architecture'
    implementation 'org.jmolecules:jmolecules-ddd' // @Module on the packages Spring Modulith documents
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('io.cucumber:cucumber-bom:7.34.7') // not in the Boot BOM, 2026-09-03
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testImplementation 'io.cucumber:cucumber-spring'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'io.confluent:kafka-schema-registry-client:8.3.1' // Confluent's own, not in the Boot BOM, 2026-09-07
    testImplementation 'org.jmolecules.integrations:jmolecules-archunit'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0' // not in the Boot BOM, 2026-09-07
    testImplementation platform('org.springframework.modulith:spring-modulith-bom:2.1.1') // not in the Boot BOM, 2026-09-08
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'dk.mathmagicians.playground:architecture-discovery:0.1.0-SNAPSHOT' // ours, see architecture-discovery/
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def cucumberRunner = '**/RunCucumberTest.class'

// the writer of the architecture documents runs from arch-gen, not with the unit tests
def architectureGenTag = 'architecture-gen'

tasks.named('test') {
    useJUnitPlatform {
        excludeTags architectureGenTag
    }
    exclude cucumberRunner
}

// the architecture documents, one folder per step under docs/generated/architecture: the tagged test writes the
// PlantUML sources and the canvases, PlantUML renders the diagrams to SVG with its built-in layout engine, so no
// Graphviz is needed
configurations {
    plantuml
}

dependencies {
    plantuml 'net.sourceforge.plantuml:plantuml-mit:1.2026.8' // not in the Boot BOM, 2026-09-08
}

tasks.register('generateArchitecture', Test) {
    description = 'Verifies the application modules and writes their PlantUML diagrams and canvases.'
    group = 'documentation'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags architectureGenTag
    }
    exclude cucumberRunner
    outputs.upToDateWhen { false }
}

tasks.register('renderDiagrams', JavaExec) {
    description = 'Renders the PlantUML diagrams written by generateArchitecture to SVG.'
    group = 'documentation'
    dependsOn tasks.named('generateArchitecture')
    def sources = layout.projectDirectory.dir('docs/generated/architecture/plantuml')
    def rendered = layout.projectDirectory.dir('docs/generated/architecture/svg')
    inputs.files(fileTree(sources) { include '*.puml' })
    outputs.dir(rendered)
    classpath = configurations.plantuml
    mainClass = 'net.sourceforge.plantuml.Run'
    jvmArgs '-Djava.awt.headless=true'
    args '-tsvg', '-Playout=smetana', '-o', rendered.asFile.path, "${sources.asFile}/*.puml"
}

tasks.register('bdd', Test) {
    description = 'Runs the Cucumber features. -PdryRun prints snippets for undefined steps without executing.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include cucumberRunner
    if (providers.gradleProperty('dryRun').isPresent()) {
        systemProperty 'cucumber.execution.dry-run', 'true'
    }
    // the image under test, -Pimage=<repo>:<tag>; default is the local build from bootBuildImage
    systemProperty 'bdd.image', providers.gradleProperty('image').getOrElse("${project.name}:${project.version}")
    testLogging.showStandardStreams = true
    outputs.upToDateWhen { false }
}

protobuf {
    protoc {
        // same version as protobuf-java from the Boot BOM
        artifact = "com.google.protobuf:protoc:${dependencyManagement.importedProperties['protobuf-java.version']}"
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.notCompatibleWithConfigurationCache('protobuf-gradle-plugin 0.10.0 keeps Project state in the task')
            if (task.sourceSet.name == 'main') {
                // generated code is committed, see README: Repository layout
                task.outputBaseDirProperty.set(layout.projectDirectory.dir('src/generated'))
            }
        }
    }
}

tasks.named('bootBuildImage') {
    // launch environment of the image, inherited by compose, docker run, and the integration tests
    environment = ['BPE_BPL_JAVA_NMT_ENABLED': 'false']
    // the image is no file, so a build record is the output; with it Gradle skips the task while the jar and the
    // image name are unchanged
    def record = layout.buildDirectory.file("image/${project.version}.txt")
    def image = imageName
    outputs.file(record)
    doLast { record.get().asFile.text = "${image.get()}\n" }
}

tasks.register('version') {
    description = 'Prints the version.'
    group = 'help'
    def current = version
    doLast { println current }
}

tasks.register('nextVersion') {
    description = 'Prints the next version, the SNAPSHOT without its suffix.'
    group = 'help'
    def next = nextVersion
    doLast { println next }
}

// generated code is committed: compile from src/generated, regenerate with make proto-gen.
// Plain directories only, so no build depends on the generate tasks.
sourceSets.main.java.srcDirs = ['src/main/java', 'src/generated/java']
sourceSets.test.java.srcDirs = ['src/test/java']
