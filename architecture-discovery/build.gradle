plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'dk.mathmagicians.playground'
version = '0.1.0-SNAPSHOT'
description = 'The hexagon of an application as a PlantUML diagram, from its jMolecules stereotypes and Spring Modulith modules'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

// every version is pinned with its date; the Boot BOM only aligns the Spring versions Modulith builds on
dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.1') // 2026-09-08
    api platform('org.springframework.modulith:spring-modulith-bom:2.1.1') // 2026-09-08
    api platform('org.jmolecules:jmolecules-bom:2025.0.2') // 2026-09-08
    api 'org.springframework.modulith:spring-modulith-core'
    api 'org.jmolecules.integrations:jmolecules-stereotype'
    // the stereotype catalog reader, optional in jmolecules-stereotype, required by HexagonDocumenter's default
    implementation 'com.jayway.jsonpath:json-path'
    // Modulith reads the module detection strategy through Boot's configuration data at runtime
    runtimeOnly 'org.springframework.boot:spring-boot'
    testImplementation platform('org.junit:junit-bom:6.1.3') // 2026-09-08
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.7' // 2026-09-08
    testImplementation 'org.jmolecules:jmolecules-hexagonal-architecture'
    testImplementation 'org.jmolecules:jmolecules-ddd'
}

tasks.named('test') {
    useJUnitPlatform()
}

// the jar and its sources to GitHub Packages under the repository; GITHUB_ACTOR and GITHUB_TOKEN from the
// environment, CI's own or `gh auth token` on a developer machine
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/mathmagicians/confluent-eventing-playground')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
