spring.application.name=confluent-eventing-playground
# the profile when none is given; local publishes to the log and reads nothing. test and prod are Confluent Cloud,
# connected by the platform's kafka.properties, each naming its topics
spring.profiles.default=local

# the application modules Spring Modulith documents and verifies are the packages marked @ApplicationModule
spring.modulith.detection-strategy=explicitly-annotated

# the story this process plays; its settings are the bundle of the same name, --load.type=order and so on, with
# their defaults in the bundle's record; compose.yaml passes them as command line arguments
story=load

# console line: time, level, thread, class, message
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) [%t] %clr(%logger{0}){cyan} %clr(:){faint} %m%n%wEx
