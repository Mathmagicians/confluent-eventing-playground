spring.application.name=wonderland-eventing-playground
# what every distribution of the platform wants: the profiles, the Modulith strategy, the console line
spring.config.import=classpath:platform.properties

# the story this process plays; its settings are the bundle of the same name, --load.type=order and so on, with
# their defaults in the bundle's record; compose.yaml passes them as command line arguments
story=load
