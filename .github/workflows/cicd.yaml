name: cicd

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: generated code matches the schema
        run: make proto-check
      - name: compile, unit tests, jar
        run: make build
      - name: container image
        run: make image
      - name: integration tests, Cucumber with Testcontainers
        run: make bdd
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish the image to ghcr.io
        if: github.event_name == 'push'
        run: make publish REGISTRY=ghcr.io/${{ github.repository_owner }} TAGS="0.0.1-SNAPSHOT sha-${GITHUB_SHA::7}${{ github.ref == 'refs/heads/main' && ' latest' || '' }}"
