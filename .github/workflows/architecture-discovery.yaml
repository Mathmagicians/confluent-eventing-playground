name: architecture-discovery

# the library in architecture-discovery/, on the same triggers as cicd, for changes under its own folder only
on:
  pull_request:
    branches: [main]
    paths: [architecture-discovery/**]
  push:
    branches: [main]
    paths: [architecture-discovery/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
      - name: compile, tests, jar
        run: make discovery-build
      - name: publish the snapshot to GitHub Packages, where the cicd workflow takes it from
        run: make discovery-publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
