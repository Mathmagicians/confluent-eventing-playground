name: architecture-discovery

# the library in architecture-discovery/, on the same triggers as cicd. The job always runs, so it can be a
# required check on main, and does its work when its folder or this file changed; a run with nothing to do is
# green in seconds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  architecture-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the diff below needs the base of the pull request or the pushed range
      - name: changes under architecture-discovery/ since the base of the pull request or the pushed range; a dispatch or an unknown base always works
        id: changes
        run: echo "library=$(make -s changed BASE='${{ github.event.pull_request.base.sha || github.event.before }}' PATHS='architecture-discovery/ .github/workflows/architecture-discovery.yaml')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.library == 'true'
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.library == 'true'
        with:
          add-job-summary: never
      - name: compile, tests, jar
        if: steps.changes.outputs.library == 'true'
        run: make discovery-build
      - name: publish the snapshot to GitHub Packages, where the cicd workflow takes it from
        if: steps.changes.outputs.library == 'true'
        run: make discovery-publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
