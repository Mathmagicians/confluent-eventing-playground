# Confluent Cloud: SASL_SSL with PLAIN, the cluster API key as the credentials; each value fails startup when unset
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";

# the key is a string, the value the Protobuf bytes of the envelope
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Schema Registry: infrastructure registers the schemas, a producer never does; it serializes with the latest
# registered version of its subject and fails when its message does not match
spring.kafka.producer.properties.auto.register.schemas=false
spring.kafka.producer.properties.use.latest.version=true

# every in-sync replica acknowledges before the send completes
spring.kafka.producer.acks=all
# a retried send keeps its sequence number, so the broker drops the duplicate and keeps the order
spring.kafka.producer.properties.enable.idempotence=true
# envelopes are small text-heavy Protobuf; lz4 shrinks them at little CPU cost
spring.kafka.producer.compression-type=lz4
# a send waits up to 20 ms for the batch to fill; the threads of one generator share the batch
spring.kafka.producer.properties.linger.ms=20
# 64 KiB per partition batch, room for a few hundred envelopes
spring.kafka.producer.batch-size=64KB
