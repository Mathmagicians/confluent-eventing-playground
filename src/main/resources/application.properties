spring.application.name=confluent-eventing-playground
# the profile when none is given; local publishes to the log
spring.profiles.default=local
# test and prod publish to Kafka: the kafka profile holds the connection, each environment names its topics
spring.profiles.group.test=kafka
spring.profiles.group.prod=kafka

# what this instance produces; compose.yaml passes these as command line arguments
load.type=offer
load.concurrent=10
load.interval=250
load.region=EMEA
load.ttl=60

# console line: time, level, thread, class, message
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) [%t] %clr(%logger{0}){cyan} %clr(:){faint} %m%n%wEx
