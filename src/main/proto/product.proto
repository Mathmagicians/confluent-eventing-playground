syntax = "proto3";
package dk.mathmagicians.playground.eventing;

option java_package = "dk.mathmagicians.playground.eventing";
option java_outer_classname = "ProductDTO";

import "google/protobuf/timestamp.proto";

message Product {
    string producer_id = 1;
    string product_id = 2;
    string product_name = 3;
    string product_description = 4;
    google.protobuf.Timestamp created_at = 5;
}
