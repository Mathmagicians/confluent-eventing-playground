# Cucumber through the JUnit Platform Suite engine, see RunCucumberTest.
# Reports under build/reports/cucumber: the HTML report, the JSON for tooling, and the pretty text for job summaries.
cucumber.plugin=pretty, html:build/reports/cucumber/index.html, json:build/reports/cucumber/cucumber.json, pretty:build/reports/cucumber/pretty.txt
cucumber.ansi-colors.disabled=true
cucumber.publish.quiet=true
cucumber.junit-platform.naming-strategy=long
